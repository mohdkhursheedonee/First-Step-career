import json
import urllib.request
import urllib.error
from datetime import datetime, timezone
import re

OUTPUT_FILE = "jobs.json"
MAX_JOBS = 15

# Public zero-auth APIs for tech, freshers, and remote roles
SOURCES = [
    {
        "name": "Remotive API",
        "url": "https://remotive.com/api/remote-jobs?limit=15",
        "type": "remotive"
    },
    {
        "name": "Arbeitnow API",
        "url": "https://www.arbeitnow.com/api/job-board-api",
        "type": "arbeitnow"
    }
]

def categorize_job(title, tags, location):
    """
    Categorizes jobs into 'fresher', 'remote', or 'tech' based on title and metadata.
    """
    text_to_check = f"{title} {' '.join(tags)} {location}".lower()
    
    categories = []
    
    # Check for Fresher/Junior indicators
    if any(k in text_to_check for k in ['junior', 'fresher', 'trainee', 'entry', 'intern', 'associate', 'graduate', '2024', '2025', '2026']):
        categories.append('fresher')
        
    # Check for Remote indicators
    if any(k in text_to_check for k in ['remote', 'work from home', 'wfh', 'anywhere']):
        categories.append('remote')
        
    # Check for Tech/IT indicators
    if any(k in text_to_check for k in ['developer', 'engineer', 'software', 'python', 'java', 'react', 'web', 'data', 'tech', 'qa', 'frontend', 'backend']):
        categories.append('tech')
        
    # Default fallback category if none matched
    if not categories:
        categories.append('fresher')
        
    return categories

def fetch_json(url):
    """
    Fetches JSON data from HTTP endpoint with custom User-Agent header.
    """
    req = urllib.request.Request(
        url, 
        headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) FirstStepCareersBot/1.0'}
    )
    try:
        with urllib.request.urlopen(req, timeout=10) as response:
            return json.loads(response.read().decode('utf-8'))
    except Exception as e:
        print(f"⚠️ Error fetching {url}: {e}")
        return None

def parse_remotive(data):
    jobs = []
    if not data or 'jobs' not in data:
        return jobs
        
    for item in data['jobs'][:10]:
        title = item.get('title', 'Job Opening')
        company = item.get('company_name', 'Verified Employer')
        location = item.get('candidate_required_location') or 'Remote / Anywhere'
        tags = item.get('tags') or [item.get('category', '')]
        
        parsed_job = {
            "id": f"remotive-{item.get('id')}",
            "title": title,
            "company": company,
            "location": location,
            "salary": item.get('salary') or "Best in Industry / Negotiable",
            "categories": categorize_job(title, tags, location),
            "badge": "🔥 Urgent Hiring",
            "posted_date": item.get('publication_date', '')[:10] or "Today",
            "url": item.get('url', 'https://whatsapp.com/channel/0029Vb2DJIiISTkIFQBEc20E'),
            "source": "Remotive"
        }
        jobs.append(parsed_job)
    return jobs

def parse_arbeitnow(data):
    jobs = []
    if not data or 'data' not in data:
        return jobs
        
    for item in data['data'][:10]:
        title = item.get('title', 'Job Opening')
        company = item.get('company_name', 'Verified Employer')
        location = item.get('location') or 'Work From Home'
        tags = item.get('tags') or []
        
        parsed_job = {
            "id": f"arbeit-{item.get('slug')}",
            "title": title,
            "company": company,
            "location": location,
            "salary": "As per company standards",
            "categories": categorize_job(title, tags, location),
            "badge": "🏠 100% Remote Job" if item.get('remote') else "🎯 Active Drive",
            "posted_date": datetime.now(timezone.utc).strftime("%Y-%m-%d"),
            "url": item.get('url', 'https://whatsapp.com/channel/0029Vb2DJIiISTkIFQBEc20E'),
            "source": "Arbeitnow"
        }
        jobs.append(parsed_job)
    return jobs

def main():
    print("🚀 Starting First Step Careers Job Synchronizer...")
    all_jobs = []

    for source in SOURCES:
        print(f"📡 Fetching from {source['name']}...")
        raw_data = fetch_json(source['url'])
        
        if source['type'] == 'remotive':
            parsed = parse_remotive(raw_data)
        elif source['type'] == 'arbeitnow':
            parsed = parse_arbeitnow(raw_data)
        else:
            parsed = []
            
        all_jobs.extend(parsed)
        print(f"✅ Fetched {len(parsed)} jobs from {source['name']}")

    # Remove duplicates based on title and company
    unique_jobs = {}
    for job in all_jobs:
        key = f"{job['title'].lower()}-{job['company'].lower()}"
        if key not in unique_jobs:
            unique_jobs[key] = job

    final_job_list = list(unique_jobs.values())[:MAX_JOBS]

    # Save to JSON structure
    output_payload = {
        "last_updated": datetime.now(timezone.utc).isoformat(),
        "total_jobs": len(final_job_list),
        "jobs": final_job_list
    }

    with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
        json.dump(output_payload, f, indent=2, ensure_ascii=False)

    print(f"🎉 Successfully synced {len(final_job_list)} live jobs into '{OUTPUT_FILE}'!")

if __name__ == "__main__":
    main()
