name: Sync Live Jobs Cron

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Latest Jobs
        run: python fetch_jobs.py

      - name: Commit & Push Updated Jobs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-sync: Updated live job postings [skip ci]" && git push)
